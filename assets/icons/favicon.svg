<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="#07070a" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5" />
  <!-- Headphone arch -->
  <path d="M 16 34 A 16 16 0 0 1 48 34" fill="none" stroke="url(#auraGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#neonBlur)" />
  <!-- Left earcup -->
  <rect x="12" y="32" width="8" height="18" rx="4" fill="#00f2fe" filter="url(#neonBlur)" />
  <!-- Right earcup -->
  <rect x="44" y="32" width="8" height="18" rx="4" fill="#7928ca" filter="url(#neonBlur)" />
  <!-- Center audio pulse dot -->
  <circle cx="32" cy="38" r="2.5" fill="#00f2fe" />
</svg>
