<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="auraBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neonAuraFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 3D Spatial Audio Orbital Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#auraBrandGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" />
  
  <!-- Outer Sound Resonance Waves -->
  <path d="M 6 24 C 6 18 10 13 14 11" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 42 24 C 42 18 38 13 34 11" stroke="#7928ca" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Headphone Ergonomic Arch -->
  <path d="M 13 25 C 13 15 17 9 24 9 C 31 9 35 15 35 25" stroke="url(#auraBrandGrad)" stroke-width="3" stroke-linecap="round" filter="url(#neonAuraFilter)" />

  <!-- Earcups (Precision Aerospace Aluminum Cylinders) -->
  <rect x="10" y="22" width="6" height="13" rx="3" fill="#00f2fe" filter="url(#neonAuraFilter)" />
  <rect x="32" y="22" width="6" height="13" rx="3" fill="#7928ca" filter="url(#neonAuraFilter)" />

  <!-- Center Equalizer Frequency Bars -->
  <rect x="20" y="21" width="2.2" height="9" rx="1.1" fill="#00f2fe" />
  <rect x="23.5" y="18" width="2.2" height="15" rx="1.1" fill="#ffffff" filter="url(#neonAuraFilter)" />
  <rect x="27" y="21" width="2.2" height="9" rx="1.1" fill="#7928ca" />
</svg>
